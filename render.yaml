services:
  - type: web
    name: truthlens-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: TRUTHLENS_CORS_ORIGINS
        value: https://truthlens-web.onrender.com

  - type: static
    name: truthlens-web
    buildCommand: npm ci && npx vite build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://truthlens-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
